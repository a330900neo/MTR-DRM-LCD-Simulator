<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTR DRM Display Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        #drm-container {
            width: 100vw;
            height: 28.125vw;
            max-height: 100vh;
            max-width: 355.55vh;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 0.5Hz Sharp Toggle Animation (2s total cycle) */
        @keyframes blinkAnim {
            0%, 49% { fill: #ffcc00; }
            50%, 100% { fill: #ffffff; }
        }

        .blink-station {
            animation: blinkAnim 2s infinite;
        }

        /* Interactive Controls UI */
        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .controls button {
            background: #2b67a1;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #1c4a75;
        }

        .controls button:active {
            background: #11304f;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="prevStop()">&#9664; Previous Step</button>
        <button onclick="switchDirection()">&#8644; Switch Direction</button>
        <button onclick="nextStop()">Next Step &#9654;</button>
    </div>

    <div id="drm-container"></div>

    <script>
        const mtrData = {
            lineColor: "#2b67a1",
            pastLineColor: "#a0a0a0",
            stations: [
                { id: "CHW", zh: "柴灣", en: "Chai Wan" },
                { id: "HFC", zh: "杏花邨", en: "Heng Fa Chuen" },
                { id: "SKW", zh: "筲箕灣", en: "Shau Kei Wan" },
                { id: "SWH", zh: "西灣河", en: "Sai Wan Ho" },
                { id: "TAK", zh: "太古", en: "Tai Koo" },
                { 
                    id: "QUB", zh: "鰂魚涌", en: "Quarry Bay",
                    interchange: {
                        type: "stub",
                        lines: [ { color: "#834e98", zh: "將軍澳綫", en: "Tseung Kwan O Line" } ]
                    }
                },
                { id: "NOP", zh: "北角", en: "North Point" },
                { id: "FOH", zh: "炮台山", en: "Fortress Hill" },
                { id: "TIH", zh: "天后", en: "Tin Hau" },
                { id: "CAB", zh: "銅鑼灣", en: "Causeway Bay" },
                { id: "WAC", zh: "灣仔", en: "Wan Chai" },
                { 
                    id: "ADM", zh: "金鐘", en: "Admiralty",
                    interchange: {
                        type: "pill",
                        lines: [
                            { color: "#5bb1e4", zh: "東鐵綫", en: "East Rail Line" },
                            { color: "#b6d000", zh: "南港島綫", en: "South Island Line" },
                            { color: "#e2231a", zh: "荃灣綫", en: "Tsuen Wan Line" }
                        ]
                    }
                },
                { 
                    id: "CEN", zh: "中環", en: "Central",
                    interchange: {
                        type: "link", linkZh: "香港", linkEn: "Hong Kong",
                        lines: [
                            { color: "#00718b", zh: "機場快綫", en: "Airport Express" },
                            { color: "#f38b00", zh: "東涌綫", en: "Tung Chung Line" }
                        ]
                    }
                },
                { id: "SHW", zh: "上環", en: "Sheung Wan" },
                { id: "SYP", zh: "西營盤", en: "Sai Ying Pun" },
                { id: "HKU", zh: "香港大學", en: "HKU" },
                { id: "KET", zh: "堅尼地城", en: "Kennedy Town" }
            ]
        };

        // State Engine Variables
        let currentStationIdx = 6;     
        let currentDirection = 1;      // 1 = Forward, -1 = Backward
        let subState = "ARRIVED";      // Modes: "ARRIVED", "LEAVING", "ZOOM", "MAP"

        // Sequence Progression Controller 
        function nextStop() {
            const maxIdx = mtrData.stations.length - 1;
            if (subState === "ARRIVED") {
                subState = "LEAVING";
            } else if (subState === "LEAVING") {
                // Transition to moving map: update target to NEXT station
                if (currentDirection === 1 && currentStationIdx < maxIdx) {
                    currentStationIdx++;
                } else if (currentDirection === -1 && currentStationIdx > 0) {
                    currentStationIdx--;
                }
                subState = "ZOOM";
            } else if (subState === "ZOOM") {
                subState = "MAP";
            } else if (subState === "MAP") {
                subState = "ARRIVED";
            }
            generateDRM();
        }

        function prevStop() {
            const maxIdx = mtrData.stations.length - 1;
            if (subState === "ARRIVED") {
                subState = "MAP";
            } else if (subState === "MAP") {
                subState = "ZOOM";
            } else if (subState === "ZOOM") {
                // Moving back: update target to PREVIOUS station
                if (currentDirection === 1 && currentStationIdx > 0) {
                    currentStationIdx--;
                } else if (currentDirection === -1 && currentStationIdx < maxIdx) {
                    currentStationIdx++;
                }
                subState = "LEAVING";
            } else if (subState === "LEAVING") {
                subState = "ARRIVED";
            }
            generateDRM();
        }

        function switchDirection() {
            currentDirection *= -1;
            generateDRM();
        }

        function generateDRM() {
            const container = document.getElementById('drm-container');
            const data = mtrData;
            const viewBoxWidth = 3200;
            const viewBoxHeight = 900;
            
            let svgContent = `<svg viewBox="0 0 ${viewBoxWidth} ${viewBoxHeight}" xmlns="http://www.w3.org/2000/svg">`;

            // === SHARED BACKGROUND ===
            svgContent += `<rect x="0" y="0" width="${viewBoxWidth}" height="${viewBoxHeight}" fill="#1a1a1a"/>`;
            svgContent += `<rect x="40" y="40" width="${viewBoxWidth-80}" height="${viewBoxHeight-80}" fill="#f7f9fa"/>`;
            
            // Mask to cut off elements cleanly at the frame edge
            svgContent += `<defs>
                <clipPath id="panelClip">
                    <rect x="40" y="40" width="${viewBoxWidth-80}" height="${viewBoxHeight-80}" />
                </clipPath>
            </defs>`;

            // =========================================================================
            // RENDER MODE: STATION ARRIVAL / DEPARTURE DETAILED VIEW
            // =========================================================================
            if (subState === "ARRIVED" || subState === "LEAVING") {
                const station = data.stations[currentStationIdx];
                
                const zhFontSize = 180;      
                const enFontSize = 120;      
                const circRad = 69;         
                const circStroke = 16;      
                const yellowBarFont = 110;  
                const detailPadding = 50;   
                let centerY = 350;
                
                // Warning Notification Bar
                svgContent += `<rect x="40" y="660" width="${viewBoxWidth-80}" height="200" fill="#fbc423"/>`;
                
                let noticeText = subState === "ARRIVED" ? "請小心月台空隙 Please mind the gap" : "請勿靠近車門 Please stand back from the doors";
                
                svgContent += `<text x="${viewBoxWidth/2}" y="795" font-size="${yellowBarFont}" font-weight="bold" fill="#000000" text-anchor="middle" font-family="system-ui, sans-serif">${noticeText}</text>`;
                
                // Group calculation for absolute centering
                const zhTextEst = station.zh.length * zhFontSize;
                const enTextEst = station.en.length * enFontSize * 0.55; 
                const groupedBlockWidth = zhTextEst + detailPadding + (circRad * 2) + detailPadding + enTextEst;
                const groupedBlockStartX = (viewBoxWidth / 2) - (groupedBlockWidth / 2);

                svgContent += `<g transform="translate(${groupedBlockStartX}, 0)">`;
                let currentX = 0; 

                // Chinese Name
                svgContent += `<text x="${currentX}" y="${centerY + 55}" font-size="${zhFontSize}" font-weight="bold" fill="#000000" text-anchor="start">${station.zh}</text>`;
                currentX += zhTextEst + detailPadding; 

                // Station Node Circle
                svgContent += `<circle class="blink-station" cx="${currentX + circRad}" cy="${centerY}" r="${circRad}" fill="#ffcc00" stroke="#000000" stroke-width="${circStroke}"/>`;
                currentX += (circRad * 2) + detailPadding; 

                // English Name 
                svgContent += `<text x="${currentX}" y="${centerY + 30}" font-size="${enFontSize}" font-weight="bold" fill="#000000" text-anchor="start">${station.en}</text>`;

                svgContent += `</g></svg>`;
                container.innerHTML = svgContent;
                return; 
            }

            // ==========================================
            // RENDER MODE: MAP OR ZOOM 
            // ==========================================
            const isZoom = (subState === "ZOOM");
            const yLine = 520; 
            const stationCount = data.stations.length;
            
            let displayStations = [];
            const scaleFactor = Math.min(1.75, Math.max(1.0, 15 / stationCount));

            // Window Setup based on Mode
            if (isZoom) {
                let startIdx = currentStationIdx - 2;
                let endIdx = currentStationIdx + 2;
                
                if (startIdx < 0) {
                    endIdx += Math.abs(startIdx);
                    startIdx = 0;
                }
                if (endIdx >= stationCount) {
                    startIdx -= (endIdx - stationCount + 1);
                    endIdx = stationCount - 1;
                }
                startIdx = Math.max(0, startIdx);
                endIdx = Math.min(stationCount - 1, endIdx);

                for (let i = startIdx; i <= endIdx; i++) {
                    displayStations.push({ realIdx: i, station: data.stations[i] });
                }
            } else {
                for (let i = 0; i < stationCount; i++) {
                    displayStations.push({ realIdx: i, station: data.stations[i] });
                }
            }

            const trackWidth = 32 * scaleFactor;          
            const statRadius = 21 * scaleFactor;         
            const statStroke = 6 * scaleFactor;           
            const lineSpacing = 42 * scaleFactor;
            
            const paddingX = isZoom ? 300 : (120 * scaleFactor);
            const startX = paddingX + 40; 
            const endX = viewBoxWidth - paddingX - 40;
            const displayCount = displayStations.length;              

            // DYNAMIC STATION DISTANCE (Weighted Layout for Pill Interchanges)
            let weights = [];
            let totalWeight = 0;
            for (let j = 0; j < displayCount - 1; j++) {
                let ds = displayStations[j];
                let w = 1.0; // Default Standard Track Segment Weight
                
                // If station is a Pill Interchange, make the gap to its right 25% longer
                if (ds.station.interchange && ds.station.interchange.type === "pill") {
                    w = 1.25; 
                }
                
                weights.push(w);
                totalWeight += w;
            }

            let unitWidth = displayCount > 1 ? (endX - startX) / totalWeight : 0;

            // Assign exact coordinates based on spacing weights
            displayStations.forEach((ds, index) => {
                if (index === 0) {
                    ds.x = startX;
                } else {
                    ds.x = displayStations[index - 1].x + (weights[index - 1] * unitWidth);
                }
            });

            const extendLeft = isZoom && (displayStations[0].realIdx > 0);
            const extendRight = isZoom && (displayStations[displayCount - 1].realIdx < stationCount - 1);
            const lineX1 = extendLeft ? -100 : displayStations[0].x;
            const lineX2 = extendRight ? viewBoxWidth + 100 : displayStations[displayCount - 1].x;

            // Calculate exact split coordinate for active vs past line
            let trackSplitIdx = currentStationIdx;
            if (subState === "ZOOM" || subState === "MAP") {
                // Split happens at the station we just departed from, keeping the AB line active
                trackSplitIdx = currentStationIdx - currentDirection;
            }

            let splitX;
            const splitDS = displayStations.find(ds => ds.realIdx === trackSplitIdx);
            
            if (splitDS) {
                splitX = splitDS.x;
            } else {
                // If the split station is offscreen, handle full continuous line coloring 
                if (currentDirection === 1) {
                    splitX = trackSplitIdx < displayStations[0].realIdx ? lineX1 : lineX2;
                } else {
                    splitX = trackSplitIdx > displayStations[displayCount - 1].realIdx ? lineX2 : lineX1;
                }
            }

            svgContent += `<g clip-path="url(#panelClip)">`;

            // Draw Dynamic Track Segments
            if (currentDirection === 1) {
                svgContent += `<line x1="${lineX1}" y1="${yLine}" x2="${splitX}" y2="${yLine}" stroke="${data.pastLineColor}" stroke-width="${trackWidth}" stroke-linecap="round"/>`;
                svgContent += `<line x1="${splitX}" y1="${yLine}" x2="${lineX2}" y2="${yLine}" stroke="${data.lineColor}" stroke-width="${trackWidth}" stroke-linecap="round"/>`;
            } else {
                svgContent += `<line x1="${lineX2}" y1="${yLine}" x2="${splitX}" y2="${yLine}" stroke="${data.pastLineColor}" stroke-width="${trackWidth}" stroke-linecap="round"/>`;
                svgContent += `<line x1="${splitX}" y1="${yLine}" x2="${lineX1}" y2="${yLine}" stroke="${data.lineColor}" stroke-width="${trackWidth}" stroke-linecap="round"/>`;
            }

            // Draw Direction Arrow Indicator
            let arrowX = null;
            let arrowTargetIdx = (subState === "ZOOM" || subState === "MAP") ? currentStationIdx : currentStationIdx + currentDirection;
            let arrowSourceIdx = arrowTargetIdx - currentDirection;
            
            const arrowDsTarget = displayStations.find(ds => ds.realIdx === arrowTargetIdx);
            const arrowDsSource = displayStations.find(ds => ds.realIdx === arrowSourceIdx);
            
            if (arrowDsTarget && arrowDsSource) {
                arrowX = (arrowDsSource.x + arrowDsTarget.x) / 2;
            } else if (arrowDsTarget) {
                arrowX = arrowDsTarget.x + (currentDirection === 1 ? -150 * scaleFactor : 150 * scaleFactor);
            } else if (arrowDsSource) {
                arrowX = arrowDsSource.x + (currentDirection === 1 ? 150 * scaleFactor : -150 * scaleFactor);
            }

            if (arrowX !== null) {
                const arrowScale = (trackWidth * 0.65) / 12; 
                const transX = arrowX - (8 * arrowScale);
                const transY = yLine - (8 * arrowScale);

                if (currentDirection === 1) {
                    svgContent += `<g transform="translate(${transX}, ${transY}) scale(${arrowScale})">
                            <polygon points="10 2 16 8 10 14 7 14 12 9 0 9 0 7 12 7 7 2" fill="#ffffff" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>
                        </g>`;
                } else {
                    svgContent += `<g transform="translate(${transX}, ${transY}) scale(${arrowScale})">
                            <polygon points="6 2 0 8 6 14 9 14 4 9 16 9 16 7 4 7 9 2" fill="#ffffff" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>
                        </g>`;
                }
            }

            // Draw Interchanges
            displayStations.forEach((ds) => {
                if (!ds.station.interchange) return;
                
                const isPast = (currentDirection === 1 && ds.realIdx < currentStationIdx) || (currentDirection === -1 && ds.realIdx > currentStationIdx);
                if (isPast) return; 

                const x = ds.x;
                const ic = ds.station.interchange;
                const isCurrent = (ds.realIdx === currentStationIdx);
                const nodeStroke = "#000000";
                
                const textSpacingOffset = 60 * scaleFactor;

                if (ic.type === "stub") {
                    const stubLen = 45 * scaleFactor; 
                    svgContent += `<line x1="${x}" y1="${yLine}" x2="${x}" y2="${yLine-stubLen}" stroke="${ic.lines[0].color}" stroke-width="${trackWidth}" stroke-linecap="round"/>`;
                    
                    svgContent += `<text x="${x}" y="${yLine-stubLen-(40*scaleFactor)}" font-size="${24*scaleFactor}" font-weight="bold" fill="#000" text-anchor="middle">${ic.lines[0].zh}</text>`;
                    svgContent += `<text x="${x}" y="${yLine-stubLen-(20*scaleFactor)}" font-size="${16*scaleFactor}" fill="#000" text-anchor="middle">${ic.lines[0].en}</text>`;
                }
                else if (ic.type === "pill") {
                    const numLines = ic.lines.length;
                    const pillHeight = (numLines * lineSpacing) + (statRadius * 2);
                    const pillY = yLine - (numLines * lineSpacing) - statRadius;
                    const connectionWidth = 58 * scaleFactor;

                    ic.lines.forEach((line, lIdx) => {
                        let ly = yLine - (numLines - lIdx) * lineSpacing;
                        svgContent += `<rect x="${x}" y="${ly-(10*scaleFactor)}" width="${connectionWidth}" height="${20*scaleFactor}" rx="${10*scaleFactor}" fill="${line.color}" />`;
                    });

                    let classBlink = isCurrent ? 'class="blink-station"' : '';
                    svgContent += `<rect ${classBlink} x="${x-statRadius}" y="${pillY}" width="${statRadius*2}" height="${pillHeight}" rx="${statRadius}" fill="#ffcc00" stroke="${nodeStroke}" stroke-width="${statStroke}"/>`;
                    
                    ic.lines.forEach((line, lIdx) => {
                        let ly = yLine - (numLines - lIdx) * lineSpacing;
                        svgContent += `<text x="${x+statRadius+textSpacingOffset}" y="${ly+(6*scaleFactor)}" font-size="${20*scaleFactor}" font-weight="bold" fill="#000">${line.zh}</text>`;
                        svgContent += `<text x="${x+statRadius+textSpacingOffset}" y="${ly+(24*scaleFactor)}" font-size="${16*scaleFactor}" fill="#000">${line.en}</text>`;
                    });
                }
                else if (ic.type === "link") {
                    const linkDist = 130 * scaleFactor;
                    const connectionWidth = 58 * scaleFactor;
                    
                    svgContent += `<line x1="${x}" y1="${yLine}" x2="${x}" y2="${yLine-linkDist}" stroke="#000" stroke-width="${statStroke}"/>`;
                    
                    const linkPillHeight = 75 * scaleFactor;
                    const linkPillY = yLine - linkDist - (linkPillHeight/2);
                    
                    ic.lines.forEach((line, lIdx) => {
                        let ly = yLine - linkDist - (18*scaleFactor) + (lIdx * 36 * scaleFactor); 
                        svgContent += `<rect x="${x}" y="${ly-(10*scaleFactor)}" width="${connectionWidth}" height="${20*scaleFactor}" rx="${10*scaleFactor}" fill="${line.color}" />`;
                    });

                    svgContent += `<rect x="${x-statRadius}" y="${linkPillY}" width="${statRadius*2}" height="${linkPillHeight}" rx="${statRadius}" fill="#fff" stroke="#000" stroke-width="${statStroke}"/>`;
                    
                    svgContent += `<text x="${x}" y="${linkPillY-(40*scaleFactor)}" font-size="${28*scaleFactor}" font-weight="bold" fill="#000" text-anchor="middle">${ic.linkZh}</text>`;
                    svgContent += `<text x="${x}" y="${linkPillY-(18*scaleFactor)}" font-size="${18*scaleFactor}" fill="#000" text-anchor="middle">${ic.linkEn}</text>`;

                    ic.lines.forEach((line, lIdx) => {
                        let ly = yLine - linkDist - (18*scaleFactor) + (lIdx * 36 * scaleFactor); 
                        svgContent += `<text x="${x+statRadius+textSpacingOffset}" y="${ly+(6*scaleFactor)}" font-size="${20*scaleFactor}" font-weight="bold" fill="#000">${line.zh}</text>`;
                        svgContent += `<text x="${x+statRadius+textSpacingOffset}" y="${ly+(24*scaleFactor)}" font-size="${16*scaleFactor}" fill="#000">${line.en}</text>`;
                    });
                }
            });

            // Draw Standard Stations Circles and Labels
            displayStations.forEach((ds) => {
                const x = ds.x;
                const isPast = (currentDirection === 1 && ds.realIdx < currentStationIdx) || (currentDirection === -1 && ds.realIdx > currentStationIdx);
                const isCurrent = (ds.realIdx === currentStationIdx);
                
                const nodeStroke = isPast ? data.pastLineColor : "#000000";
                let fillColor = isPast ? "#ffffff" : "#ffcc00"; 
                let classBlink = isCurrent ? 'class="blink-station"' : '';

                if (isPast || !ds.station.interchange || ds.station.interchange.type !== "pill") {
                    svgContent += `<circle ${classBlink} cx="${x}" cy="${yLine}" r="${statRadius}" fill="${fillColor}" stroke="${nodeStroke}" stroke-width="${statStroke}"/>`;
                }

                let textColor = isPast ? data.pastLineColor : "#000000";
                svgContent += `<text x="${x}" y="${yLine+(75*scaleFactor)}" font-size="${38*scaleFactor}" font-weight="bold" fill="${textColor}" text-anchor="middle" letter-spacing="2">${ds.station.zh}</text>`;
                svgContent += `<text x="${x}" y="${yLine+(105*scaleFactor)}" font-size="${20*scaleFactor}" fill="${textColor}" text-anchor="middle">${ds.station.en}</text>`;
            });

            svgContent += `</g></svg>`;
            container.innerHTML = svgContent;
        }

        // Run Initial Assembly Loop
        generateDRM();
    </script>
</body>
</html>
